[package]
name = "rvm-burn"
authors = ["Raphael Menges, Ramin Hedeshy"]
version = "0.0.0"
edition = "2024"
license = "GPL-3.0"

[dependencies]
image = "0.25"
burn = { git = "https://github.com/raphaelmenges/burn", branch = "faster-rvm", default-features = false, features = ["std", "flex", "simd", "rayon", "fusion", "autotune", "persistence", "x86-v4"] }
burn-store = { git = "https://github.com/raphaelmenges/burn", branch = "faster-rvm", default-features = false, features = ["std"] }
ort = "2.0.0-rc.15"
mimalloc = "0.1.52"
rayon = "1.12.0"

[features]
default = ["ort-webgpu"]
ort-webgpu = ["ort/webgpu"]
ort-directml = ["ort/directml"]
ort-coreml = ["ort/coreml"]

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
burn = { git = "https://github.com/raphaelmenges/burn", branch = "faster-rvm", default-features = false, features = ["vulkan"] }

[target.'cfg(target_os = "macos")'.dependencies]
burn = { git = "https://github.com/raphaelmenges/burn", branch = "faster-rvm", default-features = false, features = ["metal"] }

[build-dependencies]
burn-onnx = "0.23.0-pre.2"

[profile.release]
debug = false
lto = "thin"
strip = true
opt-level = 3
codegen-units = 1
panic = "abort"
