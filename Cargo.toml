[package]
name = "rvm-burn"
authors = ["Raphael Menges, Ramin Hedeshy"]
version = "0.0.0"
edition = "2024"
license = "GPL-3.0"

[dependencies]
image = "0.25"
burn = { version="0.22.0-pre.3", default-features = false, features = ["std", "flex", "simd", "rayon", "fusion"] }
burn-store = { version="0.22.0-pre.3", default-features = false, features = ["std"] }
ort = { version = "2.0.0-rc.13" }

[features]
default = ["ort-webgpu"]
ort-webgpu = ["ort/webgpu"]
ort-directml = ["ort/directml"]
ort-coreml = ["ort/coreml"]

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
burn = { version="0.22.0-pre.3", default-features = false, features = ["vulkan"] }

[target.'cfg(target_os = "macos")'.dependencies]
burn = { version="0.22.0-pre.3", default-features = false, features = ["metal"] }

[build-dependencies]
burn-onnx = "0.22.0-pre.3"

[profile.release]
debug = false
lto = "thin"
strip = true
opt-level = 3
codegen-units = 1
panic = "abort"
